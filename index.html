<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>to-do list</title>
    <style>
        body {
            font-family: arial, sans-serif;
        }
        #todolist {
            border-collapse: collapse;
            width: 70%;
            margin: 0 auto;
        }
        #todolist th, #todolist td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        #todolist th {
            background-color: #f0f0f0;
        }
        #todolist th:first-child, #todolist th:last-child {
            width: 5%;
        }
        #todolist th:nth-child(2) {
            width: 90%;
        }
        .add-form {
            margin-top: 20px;
            width: 70%;
            margin: 20px auto;
        }
        .add-form input[type="text"] {
            padding: 8px;
            width: 70%;
        }
        .add-form button {
            padding: 8px;
            width: 20%;
        }
    </style>
</head>
<body>

<h2 style="text-align: center;">to-do list</h2>

<table id="todolist">
    <thead>
        <tr>
            <th>number</th>
            <th>text</th>
            <th>action</th>
        </tr>
    </thead>
    <tbody id="listbody">
        {{rows}}
    </tbody>
</table>

<form id="add-form" class="add-form" method="post" action="/items">
  <input type="text" name="text" placeholder="новый элемент" required>
  <button type="submit">добавить</button>
</form>


</body>
</html>
